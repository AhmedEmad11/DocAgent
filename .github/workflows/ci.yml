name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore DocAgent.slnx

      - name: Build
        run: dotnet build DocAgent.slnx --no-restore --configuration Release

      # Integration tests use Testcontainers; Docker is available on ubuntu-latest runners.
      - name: Test
        run: dotnet test DocAgent.slnx --no-build --configuration Release --logger "console;verbosity=normal"
