name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      # Embedding model (SRS D30): pinned revision + SHA-256 verified by the script; cached on the script's hash.
      - name: Cache embedding model
        uses: actions/cache@v6
        with:
          path: models
          key: models-${{ hashFiles('scripts/download-models.sh') }}

      - name: Download embedding model
        run: scripts/download-models.sh

      - name: Restore
        run: dotnet restore DocAgent.slnx

      - name: Build
        run: dotnet build DocAgent.slnx --no-restore --configuration Release

      # Integration tests use Testcontainers; Docker is available on ubuntu-latest runners.
      - name: Test
        run: dotnet test DocAgent.slnx --no-build --configuration Release --logger "console;verbosity=normal"

  # Phase 8: the infrastructure template must at least compile. No Azure login or subscription is needed for this.
  infra-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compile Bicep
        run: az bicep build --file infra/main.bicep --stdout > /dev/null

  # Phase 8: the container image must build (model download + SHA check, publish). Not pushed anywhere.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: SnapDeploy free-tier Dockerfile limits (max 2 stages, max 3000 bytes)
        run: |
          stages=$(grep -ci '^FROM ' Dockerfile); bytes=$(wc -c < Dockerfile)
          echo "stages=$stages bytes=$bytes"
          [ "$stages" -le 2 ] && [ "$bytes" -le 3000 ]

      - name: Build image
        run: docker build --tag docagent-api:ci .

  # Phase 9.0: Next.js frontend in web/. Runs only when the UI or this workflow changes.
  web-changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          # New branch pushes and force pushes have no usable base: run the job.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$base" "${{ github.sha }}" | grep -qE '^(web/|\.github/workflows/ci\.yml$)'; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=false" >> "$GITHUB_OUTPUT"
          fi

  web:
    needs: web-changes
    if: needs.web-changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint and format check
        run: npm run lint

      - name: Message catalogs in sync (en/ar)
        run: npm run check:i18n

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Runs against the production build and the mock API (web/e2e/mock-api), started by playwright.config.ts.
      - name: E2E tests
        run: npm run e2e
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
