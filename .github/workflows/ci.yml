name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      # Embedding model (SRS D30): pinned revision + SHA-256 verified by the script; cached on the script's hash.
      - name: Cache embedding model
        uses: actions/cache@v6
        with:
          path: models
          key: models-${{ hashFiles('scripts/download-models.sh') }}

      - name: Download embedding model
        run: scripts/download-models.sh

      - name: Restore
        run: dotnet restore DocAgent.slnx

      - name: Build
        run: dotnet build DocAgent.slnx --no-restore --configuration Release

      # Integration tests use Testcontainers; Docker is available on ubuntu-latest runners.
      - name: Test
        run: dotnet test DocAgent.slnx --no-build --configuration Release --logger "console;verbosity=normal"
